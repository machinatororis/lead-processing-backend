services:
  postgres:
    image: postgres:16
    container_name: leads_postgres
    environment:
      POSTGRES_DB: leads_db
      POSTGRES_USER: leads_user
      POSTGRES_PASSWORD: leads_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: leads_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: